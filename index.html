<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Emoji Blasters — Asteroids, but everything is an emoji. Rotate, thrust, blast rocks (and snacks, and sea monsters) into smaller rocks.">
<meta name="theme-color" content="#05060d">
<title>Emoji Blasters</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060d; color: #e8ecf5;
    overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  #game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

</style>
</head>
<body>
<canvas id="game" aria-label="Emoji Blasters game canvas" role="img"></canvas>
<script>
(() => {
  'use strict';
  // Deployed commit, stamped by `emoji deploy` on the droplet
  // (the sed there is anchored to exactly this two-space-indented line).
  const BUILD = 'dev';

  // ───────────────────────── config ─────────────────────────
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
  const UI_FONT = 'ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';

  const SHIP = {
    emoji: '🚀',
    size: 38,
    // 🚀 points up-right in every major emoji set; this is the rotation that
    // makes it face heading 0 (east). Tweak if a font disagrees.
    tilt: Math.PI / 4,
    r: 14,
    turn: 4.4,          // rad/s
    thrust: 430,        // px/s²
    maxSpeed: 560,      // px/s
    drag: 0.45,         // exponential decay per second
    fireCd: 0.17,       // s between shots
    bulletSpeed: 660,
    bulletLife: 1.15,
    maxBullets: 6,
    invuln: 3,          // s after (re)spawn
    hyperCd: 4,         // s between hyperspace jumps
  };

  const TIERS = [
    { size: 80, r: 33, speed: [35, 85],   score: 20,  spin: 0.6 },
    { size: 50, r: 20, speed: [65, 140],  score: 50,  spin: 1.2 },
    { size: 30, r: 12, speed: [110, 215], score: 100, spin: 2.2 },
  ];

  const THEMES = [
    { name: 'ROCK & ROLL',     set: ['🪨', '🌕', '☄️', '🌗', '🪐', '🌝'] },
    { name: 'SNACK ATTACK',    set: ['🍩', '🍪', '🥨', '🍔', '🍕', '🧀'] },
    { name: 'GARDEN VARIETY',  set: ['🥔', '🥦', '🍅', '🧅', '🥑', '🍄'] },
    { name: 'DEEP SEA',        set: ['🐙', '🦑', '🐡', '🦀', '🐚', '🐠'] },
    { name: 'SPOOKY SEASON',   set: ['🎃', '👻', '💀', '🕷️', '🧟', '🦇'] },
    { name: 'ZOO BREAKOUT',    set: ['🐷', '🐸', '🐵', '🐻', '🦁', '🐼'] },
    { name: 'JUNK DRAWER',     set: ['🧦', '🧲', '🔋', '🧸', '🎲', '🪀'] },
  ];

  const UFOS = {
    big:   { emoji: '🛸', size: 48, r: 20, speed: 95,  score: 200,  fireCd: 1.7, aim: 0.9,  bullet: 360 },
    small: { emoji: '👾', size: 32, r: 13, speed: 145, score: 1000, fireCd: 1.1, aim: 0.18, bullet: 420 },
  };

  const POWERUPS = {
    shield: { emoji: '🛡️', dur: 9, label: 'SHIELD' },
    rapid:  { emoji: '⚡', dur: 8, label: 'RAPID'  },
    life:   { emoji: '❤️', dur: 0, label: '1UP'    },
  };

  const EXTRA_LIFE_EVERY = 10000;
  const HI_KEY = 'emoji-blasters.hiscore';

  // ───────────────────────── canvas ─────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let stars = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (dpr !== DPR) spriteCache.clear();
    DPR = dpr;
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round((W * H) / 9000);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      s: Math.random() < 0.15 ? 2 : 1, tw: Math.random() * Math.PI * 2,
      v: 2 + Math.random() * 6,
    }));
  }

  // Emoji are rasterised once per (glyph, size bucket) into an offscreen
  // canvas and blitted with drawImage; fillText of colour emoji every frame
  // is the slow path on most browsers.
  const spriteCache = new Map();
  function bucket(size) { return size <= 20 ? 20 : size <= 40 ? 40 : size <= 80 ? 80 : 160; }
  function sprite(emoji, b) {
    const key = emoji + '@' + b;
    let s = spriteCache.get(key);
    if (s) return s;
    const pad = Math.ceil(b * 1.45);
    const c = document.createElement('canvas');
    c.width = Math.ceil(pad * DPR); c.height = Math.ceil(pad * DPR);
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    g.font = `${b}px ${EMOJI_FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, pad / 2, pad / 2 + b * 0.06);
    s = { canvas: c, w: pad, h: pad };
    spriteCache.set(key, s);
    return s;
  }
  function drawEmoji(emoji, x, y, size, rot = 0, alpha = 1) {
    if (size < 2 || alpha <= 0) return;
    const b = bucket(size);
    const s = sprite(emoji, b);
    const k = size / b;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.drawImage(s.canvas, -s.w * k / 2, -s.h * k / 2, s.w * k, s.h * k);
    ctx.restore();
  }

  // ───────────────────────── helpers ─────────────────────────
  const rand = (a, b) => a + Math.random() * (b - a);
  const choice = arr => arr[Math.floor(Math.random() * arr.length)];
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function wrap(o, m) {
    if (o.x < -m) o.x += W + 2 * m; else if (o.x > W + m) o.x -= W + 2 * m;
    if (o.y < -m) o.y += H + 2 * m; else if (o.y > H + m) o.y -= H + 2 * m;
  }
  function loadHi() { try { return parseInt(localStorage.getItem(HI_KEY), 10) || 0; } catch { return 0; } }
  function saveHi(v) { try { localStorage.setItem(HI_KEY, String(v)); } catch { /* private mode etc. */ } }

  // ───────────────────────── audio ─────────────────────────
  const audio = { ctx: null, master: null, noise: null, thrustGain: null, ufoOsc: null, ufoGain: null, muted: false };
  function audioInit() {
    if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    audio.ctx = ac;
    audio.master = ac.createGain();
    audio.master.gain.value = audio.muted ? 0 : 0.4;
    audio.master.connect(ac.destination);
    // 1s of white noise, reused by every explosion and the thruster.
    const buf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    audio.noise = buf;
    // Thruster: looping noise through a band-pass, gain ramped on/off.
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 220; bp.Q.value = 0.8;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(bp).connect(g).connect(audio.master); src.start();
    audio.thrustGain = g;
    // UFO siren: two oscillators, one modulating the other's pitch.
    const osc = ac.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 520;
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5;
    const lfoG = ac.createGain(); lfoG.gain.value = 120;
    lfo.connect(lfoG).connect(osc.frequency);
    const ug = ac.createGain(); ug.gain.value = 0;
    osc.connect(ug).connect(audio.master); osc.start(); lfo.start();
    audio.ufoOsc = osc; audio.ufoGain = ug;
  }
  function setMuted(m) {
    audio.muted = m;
    if (audio.master) audio.master.gain.setTargetAtTime(m ? 0 : 0.4, audio.ctx.currentTime, 0.02);
  }
  function tone(type, f0, f1, dur, vol = 0.25, when = 0) {
    const ac = audio.ctx; if (!ac) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function boom(dur, cutoff, vol) {
    const ac = audio.ctx; if (!ac) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = audio.noise;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(cutoff, t);
    lp.frequency.exponentialRampToValueAtTime(60, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(lp).connect(g).connect(audio.master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  const sfx = {
    shoot() { tone('square', 900, 180, 0.12, 0.12); },
    ufoShoot() { tone('sawtooth', 300, 900, 0.15, 0.1); },
    hit(tier) { boom(0.25 + tier * 0.15, 1800 - tier * 500, 0.5); },
    ufoBoom() { boom(0.7, 2500, 0.6); tone('sawtooth', 700, 40, 0.6, 0.15); },
    die() { boom(1.2, 1200, 0.8); tone('sawtooth', 220, 30, 1.0, 0.2); },
    power() { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, f, 0.12, 0.2, i * 0.07)); },
    oneUp() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone('square', f, f, 0.1, 0.15, i * 0.06)); },
    hyper() { tone('sine', 200, 1600, 0.35, 0.2); },
    wave() { [392, 523, 659].forEach((f, i) => tone('triangle', f, f, 0.15, 0.18, i * 0.1)); },
    shieldPop() { tone('triangle', 1200, 300, 0.2, 0.2); },
  };
  function setThrustSound(on) {
    if (!audio.thrustGain) return;
    audio.thrustGain.gain.setTargetAtTime(on ? 0.35 : 0, audio.ctx.currentTime, 0.05);
  }
  function setUfoSound(kind) {
    if (!audio.ufoGain) return;
    const t = audio.ctx.currentTime;
    audio.ufoGain.gain.setTargetAtTime(kind ? 0.06 : 0, t, 0.05);
    if (kind) audio.ufoOsc.frequency.setValueAtTime(kind === 'small' ? 760 : 480, t);
  }

  // ───────────────────────── state ─────────────────────────
  const S = {
    mode: 'title',        // title | play | over
    score: 0, lives: 3, wave: 0, hi: loadHi(), nextLife: EXTRA_LIFE_EVERY,
    banner: 0, bannerText: '',
    ufoTimer: 0, waveGap: 0, shake: 0, overTimer: 0, respawnIn: 0,
    paused: false, time: 0, lastKiller: '',
  };
  let ship = null;
  let asteroids = [], bullets = [], particles = [], popups = [], powerups = [];
  let ufo = null;
  const input = { left: false, right: false, thrust: false, fire: false, hyper: false, steer: null, throttle: 0 };
  function resetInput() {
    input.left = input.right = input.thrust = input.fire = input.hyper = false;
    input.steer = null; input.throttle = 0;
    stick.id = null; stick.active = false; fireTouch.id = null;
  }
  const edge = { hyper: false };                // rising-edge latch

  function newShip() {
    return {
      x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2,
      invuln: SHIP.invuln, fireCd: 0, shield: 0, rapid: 0,
      hyperCd: 0, hyperT: 0, hyperTo: null, thrusting: false, throttle: 0,
    };
  }

  function themeFor(wave) { return THEMES[(wave - 1) % THEMES.length]; }

  function spawnAsteroid(tier, x, y, emoji, bvx = 0, bvy = 0) {
    const T = TIERS[tier];
    const sp = rand(T.speed[0], T.speed[1]);
    const dir = rand(0, Math.PI * 2);
    asteroids.push({
      x, y, tier, emoji,
      vx: bvx * 0.35 + Math.cos(dir) * sp,
      vy: bvy * 0.35 + Math.sin(dir) * sp,
      rot: rand(0, Math.PI * 2), spin: rand(-T.spin, T.spin),
    });
  }

  function spawnWave(n) {
    const theme = themeFor(n);
    const count = Math.min(3 + n, 11);
    const mediums = n >= 3 ? Math.floor(count / 4) : 0;
    const origin = ship || { x: W / 2, y: H / 2 };
    for (let i = 0; i < count; i++) {
      let x, y, tries = 0;
      do {
        x = Math.random() * W; y = Math.random() * H; tries++;
      } while (Math.hypot(x - origin.x, y - origin.y) < 200 && tries < 30);
      spawnAsteroid(i < mediums ? 1 : 0, x, y, choice(theme.set));
    }
    S.bannerText = `WAVE ${n} · ${theme.name}`;
    S.banner = 2.4;
    S.ufoTimer = rand(10, 18);
    sfx.wave();
  }

  function startGame() {
    S.mode = 'play'; S.score = 0; S.lives = 3; S.wave = 1; S.nextLife = EXTRA_LIFE_EVERY;
    S.waveGap = 0; S.overTimer = 0; S.respawnIn = 0; S.shake = 0; S.paused = false; S.lastKiller = '';
    asteroids = []; bullets = []; particles = []; popups = []; powerups = []; ufo = null;
    setUfoSound(null);
    ship = newShip();
    ship.fireCd = 0.35;   // the Space/💥 that started the game must not also shoot
    edge.hyper = false;
    spawnWave(1);
  }

  function titleDemo() {
    asteroids = []; bullets = []; particles = []; popups = []; powerups = []; ufo = null; ship = null;
    const theme = THEMES[0];
    for (let i = 0; i < 7; i++) spawnAsteroid(i % 3, Math.random() * W, Math.random() * H, choice(theme.set));
  }

  function addScore(n) {
    S.score += n;
    if (S.score >= S.nextLife) {
      S.nextLife += EXTRA_LIFE_EVERY;
      S.lives++;
      popups.push({ x: W / 2, y: H * 0.3, text: '1UP ❤️', life: 1.6, big: true });
      sfx.oneUp();
    }
    if (S.score > S.hi) { S.hi = S.score; saveHi(S.hi); }
  }

  function burst(x, y, emoji, n, size, speed, life, spin = 6) {
    for (let i = 0; i < n; i++) {
      const d = rand(0, Math.PI * 2), sp = rand(speed * 0.3, speed);
      particles.push({
        x, y, vx: Math.cos(d) * sp, vy: Math.sin(d) * sp,
        emoji, life, max: life, s0: size, s1: size * 0.2,
        rot: rand(0, 6.28), spin: rand(-spin, spin),
      });
    }
  }
  function flash(x, y, emoji, s0, s1, life) {
    particles.push({ x, y, vx: 0, vy: 0, emoji, life, max: life, s0, s1, rot: 0, spin: 0 });
  }

  function destroyAsteroid(i, award) {
    const a = asteroids[i];
    const T = TIERS[a.tier];
    asteroids.splice(i, 1);
    if (a.tier < 2) {
      spawnAsteroid(a.tier + 1, a.x, a.y, a.emoji, a.vx, a.vy);
      spawnAsteroid(a.tier + 1, a.x, a.y, a.emoji, a.vx, a.vy);
    }
    burst(a.x, a.y, a.emoji, 3 + (2 - a.tier) * 2, T.size * 0.32, 160 + (2 - a.tier) * 60, 0.7);
    burst(a.x, a.y, '✨', 4, 14, 220, 0.5);
    flash(a.x, a.y, '💥', T.size * 0.6, T.size * 1.3, 0.22);
    sfx.hit(a.tier);
    if (a.tier === 0) S.shake = Math.max(S.shake, 4);
    if (award) {
      addScore(T.score);
      popups.push({ x: a.x, y: a.y, text: '+' + T.score, life: 0.9 });
      if (powerups.length < 2 && Math.random() < 0.08) {
        const r = Math.random();
        const type = r < 0.45 ? 'shield' : r < 0.9 ? 'rapid' : 'life';
        powerups.push({ x: a.x, y: a.y, vx: rand(-30, 30), vy: rand(-30, 30), type, life: 10 });
      }
    }
  }

  function destroyUfo() {
    const U = UFOS[ufo.type];
    burst(ufo.x, ufo.y, U.emoji, 5, U.size * 0.35, 200, 0.7);
    burst(ufo.x, ufo.y, '✨', 6, 14, 260, 0.6);
    flash(ufo.x, ufo.y, '💥', U.size, U.size * 2, 0.3);
    addScore(U.score);
    popups.push({ x: ufo.x, y: ufo.y, text: '+' + U.score, life: 1.1, big: true });
    S.shake = Math.max(S.shake, 6);
    sfx.ufoBoom();
    ufo = null;
    setUfoSound(null);
  }

  function killShip(by) {
    if (!ship) return;
    burst(ship.x, ship.y, '🔥', 6, 18, 220, 0.8);
    burst(ship.x, ship.y, '🔩', 4, 14, 260, 1.0, 10);
    burst(ship.x, ship.y, '💨', 3, 22, 90, 1.2, 1);
    flash(ship.x, ship.y, '💥', 40, 140, 0.45);
    S.shake = 14;
    S.lastKiller = by;
    sfx.die();
    setThrustSound(false);
    ship = null;
    S.lives--;
    if (S.lives < 0) {
      S.mode = 'over'; S.overTimer = 0;
      ufo = null; setUfoSound(null);
    } else {
      S.respawnIn = 2;
    }
  }

  function fire() {
    const rapid = ship.rapid > 0;
    const cap = rapid ? 18 : SHIP.maxBullets;
    if (bullets.filter(b => b.from === 'ship').length >= cap) return;
    const spread = rapid ? [-0.18, 0, 0.18] : [0];
    for (const off of spread) {
      const a = ship.a + off;
      bullets.push({
        x: ship.x + Math.cos(a) * 18, y: ship.y + Math.sin(a) * 18,
        vx: ship.vx + Math.cos(a) * SHIP.bulletSpeed,
        vy: ship.vy + Math.sin(a) * SHIP.bulletSpeed,
        life: SHIP.bulletLife, from: 'ship',
      });
    }
    ship.fireCd = rapid ? SHIP.fireCd * 0.5 : SHIP.fireCd;
    sfx.shoot();
  }

  function hyperspace() {
    if (ship.hyperCd > 0 || ship.hyperT > 0) return;
    ship.hyperT = 0.6;
    ship.hyperCd = SHIP.hyperCd;
    ship.hyperTo = { x: rand(W * 0.12, W * 0.88), y: rand(H * 0.15, H * 0.85) };
    ship.vx = ship.vy = 0;
    flash(ship.x, ship.y, '🌀', 46, 6, 0.4);
    setThrustSound(false);
    sfx.hyper();
  }

  function spawnUfo() {
    const small = S.wave >= 3 && (Math.random() < 0.35 || S.score > 30000);
    const type = small ? 'small' : 'big';
    const U = UFOS[type];
    const dir = Math.random() < 0.5 ? 1 : -1;
    ufo = {
      type, x: dir > 0 ? -U.size : W + U.size, y: rand(H * 0.15, H * 0.85),
      vx: dir * U.speed, vy: 0, wob: rand(0, 6.28), fireCd: 1.2, t: 0,
    };
    S.ufoTimer = rand(12, 24);   // next one, whether this one is shot or drifts off
    setUfoSound(type);
  }

  function centerClear() {
    const c = { x: W / 2, y: H / 2 };
    return !asteroids.some(a => dist(a, c) < TIERS[a.tier].r + 110) && !(ufo && dist(ufo, c) < 160);
  }

  // ───────────────────────── update ─────────────────────────
  function update(dt) {
    S.time += dt;
    if (S.banner > 0) S.banner -= dt;
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
    for (const st of stars) st.y = (st.y + st.v * dt) % H;

    // ship
    if (ship) {
      if (ship.invuln > 0) ship.invuln -= dt;
      if (ship.fireCd > 0) ship.fireCd -= dt;
      if (ship.hyperCd > 0) ship.hyperCd -= dt;
      if (ship.shield > 0) ship.shield -= dt;
      if (ship.rapid > 0) ship.rapid -= dt;

      if (ship.hyperT > 0) {
        ship.hyperT -= dt;
        ship.thrusting = false;
        if (ship.hyperT <= 0) {
          ship.x = ship.hyperTo.x; ship.y = ship.hyperTo.y;
          ship.invuln = Math.max(ship.invuln, 0.8);
          flash(ship.x, ship.y, '🌀', 6, 46, 0.35);
        }
      } else {
        if (input.left)  ship.a -= SHIP.turn * dt;
        if (input.right) ship.a += SHIP.turn * dt;
        if (input.steer !== null) {          // thumb-stick: turn toward the thumb, shortest way round
          const d = Math.atan2(Math.sin(input.steer - ship.a), Math.cos(input.steer - ship.a));
          const step = SHIP.turn * 1.6 * dt;
          ship.a += clamp(d, -step, step);
        }
        ship.throttle = input.thrust ? 1 : input.throttle;
        ship.thrusting = ship.throttle > 0;
        if (ship.thrusting) {
          ship.vx += Math.cos(ship.a) * SHIP.thrust * ship.throttle * dt;
          ship.vy += Math.sin(ship.a) * SHIP.thrust * ship.throttle * dt;
          const sp = Math.hypot(ship.vx, ship.vy);
          if (sp > SHIP.maxSpeed) { ship.vx *= SHIP.maxSpeed / sp; ship.vy *= SHIP.maxSpeed / sp; }
        }
        setThrustSound(ship.thrusting);
        const k = Math.exp(-SHIP.drag * dt);
        ship.vx *= k; ship.vy *= k;
        ship.x += ship.vx * dt; ship.y += ship.vy * dt;
        wrap(ship, SHIP.r + 6);
        if (input.fire && ship.fireCd <= 0) fire();
        if (edge.hyper) hyperspace();
      }
    } else if (S.mode === 'play') {
      S.respawnIn -= dt;
      if (S.respawnIn <= 0 && (centerClear() || S.respawnIn < -3)) ship = newShip();
    }
    edge.hyper = false;

    // asteroids
    for (const a of asteroids) {
      a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.spin * dt;
      wrap(a, TIERS[a.tier].r * 1.3);
    }

    // ufo
    if (S.mode === 'play') {
      if (!ufo) {
        if (asteroids.length > 0 && ship) {
          S.ufoTimer -= dt;
          if (S.ufoTimer <= 0) spawnUfo();
        }
      } else {
        const U = UFOS[ufo.type];
        ufo.t += dt;
        ufo.vy = Math.sin(ufo.t * 1.6 + ufo.wob) * 70;
        ufo.x += ufo.vx * dt; ufo.y += ufo.vy * dt;
        if (ufo.y < -U.r) ufo.y += H + 2 * U.r; else if (ufo.y > H + U.r) ufo.y -= H + 2 * U.r;
        if ((ufo.vx > 0 && ufo.x > W + U.size * 1.5) || (ufo.vx < 0 && ufo.x < -U.size * 1.5)) {
          ufo = null; setUfoSound(null); S.ufoTimer = rand(12, 24);
        } else {
          ufo.fireCd -= dt;
          if (ufo.fireCd <= 0) {
            ufo.fireCd = U.fireCd;
            let a = ship ? Math.atan2(ship.y - ufo.y, ship.x - ufo.x) : rand(0, 6.28);
            a += rand(-U.aim, U.aim);
            bullets.push({
              x: ufo.x + Math.cos(a) * U.r, y: ufo.y + Math.sin(a) * U.r,
              vx: Math.cos(a) * U.bullet, vy: Math.sin(a) * U.bullet,
              life: 1.7, from: 'ufo',
            });
            sfx.ufoShoot();
          }
        }
      }
    }

    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      wrap(b, 4);
      if (b.life <= 0) bullets.splice(i, 1);
    }

    // powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      wrap(p, 20);
      if (p.life <= 0) powerups.splice(i, 1);
    }

    // particles + popups
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      p.vx *= 0.985; p.vy *= 0.985;
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.life -= dt; p.y -= 28 * dt;
      if (p.life <= 0) popups.splice(i, 1);
    }

    if (S.mode === 'play') collisions();

    // wave clear
    if (S.mode === 'play' && asteroids.length === 0 && !ufo) {
      S.waveGap += dt;
      if (S.waveGap > 1.6) { S.waveGap = 0; spawnWave(++S.wave); }
    }
    if (S.mode === 'over') S.overTimer += dt;
  }

  function collisions() {
    // bullets vs asteroids / ufo / ship
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      let hit = false;
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (dist(a, b) < TIERS[a.tier].r + 3) { destroyAsteroid(j, b.from === 'ship'); hit = true; break; }
      }
      if (!hit && ufo && b.from === 'ship' && dist(ufo, b) < UFOS[ufo.type].r + 3) { destroyUfo(); hit = true; }
      if (!hit && ship && b.from === 'ufo' && ship.hyperT <= 0 && ship.invuln <= 0 && dist(ship, b) < SHIP.r + 3) {
        hit = true;
        if (ship.shield > 0) { ship.shield = 0; sfx.shieldPop(); flash(ship.x, ship.y, '🛡️', 60, 10, 0.3); }
        else killShip(UFOS[ufo ? ufo.type : 'big'].emoji);
      }
      if (hit) bullets.splice(i, 1);
    }
    if (!ship || ship.hyperT > 0) return;

    // ship vs powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      if (dist(ship, p) < SHIP.r + 16) {
        powerups.splice(i, 1);
        const P = POWERUPS[p.type];
        if (p.type === 'life') S.lives++;
        else ship[p.type] = P.dur;
        popups.push({ x: p.x, y: p.y, text: P.emoji + ' ' + P.label, life: 1.2, big: true });
        sfx.power();
      }
    }
    if (ship.invuln > 0) return;

    // ship vs asteroids
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      if (dist(a, ship) < TIERS[a.tier].r + SHIP.r * 0.8) {
        if (ship.shield > 0) {
          destroyAsteroid(j, true);
          ship.vx = (ship.x - a.x) * 6; ship.vy = (ship.y - a.y) * 6;
          ship.shield = Math.min(ship.shield, 1.5);   // a hit burns most of it
          sfx.shieldPop();
        } else {
          killShip(a.emoji);
          return;
        }
      }
    }
    // ship vs ufo body
    if (ufo && dist(ufo, ship) < UFOS[ufo.type].r + SHIP.r * 0.8) {
      const emoji = UFOS[ufo.type].emoji;
      destroyUfo();
      if (ship.shield > 0) { ship.shield = 0; sfx.shieldPop(); }
      else killShip(emoji);
    }
  }

  // ───────────────────────── render ─────────────────────────
  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05060d';
    ctx.fillRect(0, 0, W, H);
    if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));

    // stars
    for (const st of stars) {
      const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(S.time * 1.3 + st.tw));
      ctx.fillStyle = `rgba(200,215,255,${a.toFixed(2)})`;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }

    // powerups
    for (const p of powerups) {
      const blink = p.life < 2.5 && Math.floor(p.life * 8) % 2 === 0;
      if (blink) continue;
      const pulse = 1 + 0.12 * Math.sin(S.time * 8);
      ctx.beginPath(); ctx.arc(p.x, p.y, 20 * pulse, 0, 6.28);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      drawEmoji(POWERUPS[p.type].emoji, p.x, p.y, 24 * pulse);
    }

    // asteroids
    for (const a of asteroids) drawEmoji(a.emoji, a.x, a.y, TIERS[a.tier].size, a.rot);

    // ufo
    if (ufo) {
      const U = UFOS[ufo.type];
      drawEmoji(U.emoji, ufo.x, ufo.y, U.size, Math.sin(ufo.t * 6) * 0.12);
    }

    // bullets
    for (const b of bullets) {
      const ship = b.from === 'ship';
      ctx.fillStyle = ship ? 'rgba(255,240,150,.45)' : 'rgba(255,90,90,.45)';
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 6.28); ctx.fill();
      ctx.fillStyle = ship ? '#fffbe0' : '#ff6b6b';
      ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, 6.28); ctx.fill();
    }

    // ship
    if (ship && ship.hyperT <= 0) {
      const blink = ship.invuln > 0 && Math.floor(ship.invuln * 12) % 2 === 0;
      if (!blink) {
        if (ship.thrusting) {
          const fs = (20 + Math.random() * 8) * (0.55 + 0.45 * ship.throttle);
          drawEmoji('🔥', ship.x - Math.cos(ship.a) * 24, ship.y - Math.sin(ship.a) * 24, fs, ship.a - Math.PI / 2, 0.95);
        }
        drawEmoji(SHIP.emoji, ship.x, ship.y, SHIP.size, ship.a + SHIP.tilt);
      }
      if (ship.shield > 0) {
        const fade = ship.shield < 2 ? (Math.floor(ship.shield * 6) % 2 === 0 ? 0.25 : 0.7) : 0.7;
        ctx.beginPath(); ctx.arc(ship.x, ship.y, 30, 0, 6.28);
        ctx.strokeStyle = `rgba(120,200,255,${fade})`; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = 'rgba(120,200,255,.08)'; ctx.fill();
      }
    }

    // particles
    for (const p of particles) {
      const t = p.life / p.max;                  // 1 → 0
      const size = p.s1 + (p.s0 - p.s1) * t;
      drawEmoji(p.emoji, p.x, p.y, size, p.rot, Math.min(1, t * 1.6));
    }

    // popups
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = `700 ${p.big ? 24 : 16}px ${UI_FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = p.big ? '#ffe066' : '#e8ecf5';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);     // HUD ignores shake
    hud();
    if (S.mode === 'title') titleScreen();
    else if (S.mode === 'over') overScreen();
    else if (S.paused) pausedScreen();
    else if (S.banner > 0) banner();
  }

  function text(str, x, y, size, opts = {}) {
    ctx.font = `${opts.weight || 600} ${size}px ${UI_FONT}`;
    ctx.textAlign = opts.align || 'left';
    ctx.textBaseline = opts.base || 'top';
    ctx.globalAlpha = opts.alpha ?? 1;
    ctx.fillStyle = opts.color || '#e8ecf5';
    ctx.fillText(str, x, y);
    ctx.globalAlpha = 1;
  }

  function hud() {
    const small = W < 520;
    const fs = small ? 14 : 17;
    const pad = small ? 12 : 18;
    if (S.mode !== 'title') {
      text(String(S.score).padStart(6, '0'), pad, pad, fs + 6, { weight: 700 });
      text(`HI ${String(S.hi).padStart(6, '0')}`, pad, pad + fs + 12, fs - 2, { color: '#8a93a8' });
      // lives
      const n = Math.max(0, S.lives);
      const maxIcons = small ? 4 : 8;
      for (let i = 0; i < Math.min(n, maxIcons); i++) drawEmoji('🚀', W - pad - 12 - i * 26, pad + 12, 22, -Math.PI / 4);
      if (n > maxIcons) text(`×${n}`, W - pad - 12 - maxIcons * 26, pad + 4, fs - 2, { align: 'right', color: '#8a93a8' });
      text(`WAVE ${S.wave}`, W / 2, pad, fs, { align: 'center', color: '#8a93a8' });
      // active powerups + hyperspace
      if (ship) {
        let y = H - pad - fs;
        if (ship.hyperT <= 0) {
          const ready = ship.hyperCd <= 0;
          text(`🌀 ${ready ? 'READY' : ship.hyperCd.toFixed(1) + 's'}`, pad, y, fs - 2, { color: ready ? '#e8ecf5' : '#5a6275' });
          y -= fs + 6;
        }
        for (const k of ['shield', 'rapid']) {
          if (ship[k] > 0) {
            const P = POWERUPS[k];
            text(`${P.emoji} ${P.label} ${ship[k].toFixed(1)}s`, pad, y, fs - 2, { color: '#ffe066' });
            y -= fs + 6;
          }
        }
      }
    }
    text(`build ${BUILD}${audio.muted ? '  ·  🔇' : ''}`, W - pad, H - pad - 10, 11, { align: 'right', color: '#3d4456' });
    if (stick.active) {
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK.radius, 0, 6.28);
      ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5; ctx.stroke();
      const dx = stick.x - stick.ox, dy = stick.y - stick.oy, len = Math.hypot(dx, dy) || 1;
      const k = Math.min(1, STICK.radius / len);
      ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 20, 0, 6.28);
      ctx.fillStyle = `rgba(255,255,255,${0.18 + 0.25 * input.throttle})`; ctx.fill();
    }
    if (fireTouch.id !== null) {
      ctx.beginPath(); ctx.arc(fireTouch.x0, fireTouch.y0, 26, 0, 6.28);
      ctx.strokeStyle = 'rgba(255,224,102,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  function panel(w, h) {
    const x = (W - w) / 2, y = (H - h) / 2;
    ctx.fillStyle = 'rgba(5,6,13,.78)';
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 14); else ctx.rect(x, y, w, h);
    ctx.fill(); ctx.stroke();
    return { x, y, w, h };
  }

  function titleScreen() {
    const small = W < 520;
    const p = panel(Math.min(W - 24, 560), small ? 360 : 400);
    const cx = W / 2;
    let y = p.y + (small ? 22 : 34);
    text('EMOJI BLASTERS', cx, y, small ? 30 : 42, { align: 'center', weight: 800 }); y += small ? 40 : 56;
    text('asteroids, but everything is an emoji', cx, y, small ? 12 : 14, { align: 'center', color: '#8a93a8' }); y += small ? 26 : 34;
    const row = ['🚀', '🪨', '🌕', '☄️', '🛸', '💥'];
    row.forEach((e, i) => drawEmoji(e, cx + (i - (row.length - 1) / 2) * (small ? 40 : 52), y + 16, small ? 26 : 34,
      e === '🚀' ? -Math.PI / 4 : Math.sin(S.time * 1.5 + i) * 0.3));
    y += small ? 50 : 66;
    const lines = touch.enabled
      ? ['left thumb  ·  steer + thrust',
         'right thumb  ·  hold to fire',
         'flick the right side  ·  hyperspace']
      : ['← → / A D  rotate      ↑ / W  thrust',
         'SPACE  fire      SHIFT / H  hyperspace',
         'P  pause      M  mute'];
    for (const l of lines) { text(l, cx, y, small ? 11 : 13, { align: 'center', color: '#b7bfd1' }); y += small ? 18 : 22; }
    y += small ? 10 : 16;
    const blink = Math.floor(S.time * 2) % 2 === 0;
    text(touch.enabled ? 'TAP TO START' : 'PRESS ENTER TO START', cx, y, small ? 14 : 16,
      { align: 'center', weight: 700, color: blink ? '#ffe066' : '#8a6f1e' });
    y += small ? 28 : 34;
    if (S.hi > 0) text(`🏆 HIGH SCORE ${S.hi}`, cx, y, small ? 12 : 13, { align: 'center', color: '#8a93a8' });
  }

  function overScreen() {
    const small = W < 520;
    const p = panel(Math.min(W - 24, 480), 230);
    const cx = W / 2;
    let y = p.y + 28;
    text('GAME OVER', cx, y, small ? 28 : 36, { align: 'center', weight: 800 }); y += 50;
    if (S.lastKiller) { text(`taken out by ${S.lastKiller}`, cx, y, 14, { align: 'center', color: '#8a93a8' }); y += 30; }
    text(`SCORE ${S.score}  ·  WAVE ${S.wave}`, cx, y, 16, { align: 'center' }); y += 28;
    if (S.score > 0 && S.score === S.hi) text('🏆 NEW HIGH SCORE', cx, y, 15, { align: 'center', color: '#ffe066', weight: 700 });
    else text(`HIGH SCORE ${S.hi}`, cx, y, 14, { align: 'center', color: '#8a93a8' });
    y += 36;
    if (S.overTimer > 1.2) {
      const blink = Math.floor(S.time * 2) % 2 === 0;
      text(touch.enabled ? 'TAP TO PLAY AGAIN' : 'ENTER TO PLAY AGAIN', cx, y, 15,
        { align: 'center', weight: 700, color: blink ? '#ffe066' : '#8a6f1e' });
    }
  }

  function pausedScreen() {
    panel(260, 90);
    text('PAUSED', W / 2, H / 2 - 22, 26, { align: 'center', weight: 800 });
    text(touch.enabled ? 'tap to resume' : 'P to resume', W / 2, H / 2 + 14, 13, { align: 'center', color: '#8a93a8' });
  }

  function banner() {
    const a = clamp(S.banner < 0.5 ? S.banner * 2 : 1, 0, 1);
    text(S.bannerText, W / 2, H * 0.28, W < 520 ? 20 : 28, { align: 'center', weight: 800, alpha: a, color: '#ffe066' });
  }

  // ───────────────────────── input ─────────────────────────
  const KEYS = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'thrust', KeyW: 'thrust', Space: 'fire', KeyX: 'fire',
    ShiftLeft: 'hyper', ShiftRight: 'hyper', KeyH: 'hyper',
  };
  function setPaused(on) {
    if (S.mode !== 'play') return;
    S.paused = on;
    edge.hyper = false;                // a jump queued while paused must not fire on resume
    if (on) { setThrustSound(false); setUfoSound(null); }
    else if (ufo) setUfoSound(ufo.type);
  }
  function primary() {                 // Enter / tap: start, restart, resume
    audioInit();
    if (S.mode === 'title') startGame();
    else if (S.mode === 'over' && S.overTimer > 1.2) startGame();
    else if (S.paused) setPaused(false);
  }
  function togglePause() { setPaused(!S.paused); }
  window.addEventListener('keydown', e => {
    if (e.repeat) { if (KEYS[e.code] || e.code === 'Enter') e.preventDefault(); return; }
    audioInit();
    const k = KEYS[e.code];
    if (k) {
      e.preventDefault();
      input[k] = true;
      if (k === 'hyper' && !S.paused) edge.hyper = true;
      if (k === 'fire' && S.mode !== 'play') primary();
    } else if (e.code === 'Enter') { e.preventDefault(); primary(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    else if (e.code === 'KeyM') setMuted(!audio.muted);
  });
  window.addEventListener('keyup', e => {
    const k = KEYS[e.code];
    if (k) { e.preventDefault(); input[k] = false; }
  });
  window.addEventListener('blur', () => {
    resetInput();
    setPaused(true);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) setPaused(true);
  });

  // ───────────────────────── touch ─────────────────────────
  // No buttons. Left half of the screen is a floating thumb-stick: the ship
  // turns toward your thumb and thrusts by how far you push. Right half:
  // hold to fire; a quick flick there is hyperspace. `touch.enabled` only
  // decides which hints the title screen shows.
  const STICK = { dead: 10, radius: 56, follow: 64 };
  const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0, active: false };
  const fireTouch = { id: null, x0: 0, y0: 0, t0: 0, moved: false };
  const touch = { enabled: false };
  function enableTouch() { touch.enabled = true; }
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) enableTouch();
  window.addEventListener('touchstart', enableTouch, { once: true, passive: true });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    audioInit();
    if (e.pointerType === 'touch') enableTouch();
    if (S.mode !== 'play' || S.paused) { primary(); return; }
    if (e.pointerType === 'mouse') return;
    if (e.clientX < W / 2) {
      if (stick.id !== null) return;
      stick.id = e.pointerId; stick.active = true;
      stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY;
    } else {
      if (fireTouch.id !== null) return;
      fireTouch.id = e.pointerId; fireTouch.x0 = e.clientX; fireTouch.y0 = e.clientY;
      fireTouch.t0 = performance.now(); fireTouch.moved = false;
      input.fire = true;
    }
    try { canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerId === stick.id) {
      stick.x = e.clientX; stick.y = e.clientY;
      let dx = stick.x - stick.ox, dy = stick.y - stick.oy, len = Math.hypot(dx, dy);
      if (len > STICK.follow) {             // the ring follows a thumb that wanders off
        const k = STICK.follow / len;
        stick.ox = stick.x - dx * k; stick.oy = stick.y - dy * k;
        dx *= k; dy *= k; len = STICK.follow;
      }
      if (len > STICK.dead) {
        input.steer = Math.atan2(dy, dx);
        input.throttle = clamp((len - STICK.dead) / (STICK.radius - STICK.dead), 0, 1);
      } else { input.steer = null; input.throttle = 0; }
    } else if (e.pointerId === fireTouch.id) {
      if (Math.hypot(e.clientX - fireTouch.x0, e.clientY - fireTouch.y0) > 40) fireTouch.moved = true;
    }
  });
  const pointerEnd = e => {
    if (e.pointerId === stick.id) {
      stick.id = null; stick.active = false; input.steer = null; input.throttle = 0;
    } else if (e.pointerId === fireTouch.id) {
      fireTouch.id = null; input.fire = false;
      if (fireTouch.moved && performance.now() - fireTouch.t0 < 450) edge.hyper = true;   // a flick
    }
  };
  canvas.addEventListener('pointerup', pointerEnd);
  canvas.addEventListener('pointercancel', pointerEnd);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ───────────────────────── loop ─────────────────────────
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);   // first, so a thrown frame cannot end the loop
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!S.paused) update(dt);
    render();
  }

  window.addEventListener('resize', resize);
  resize();
  titleDemo();
  requestAnimationFrame(frame);

  // Read-only debug hook (used by the smoke test; harmless in production).
  window.EmojiBlasters = {
    build: BUILD,
    get state() { return S; },
    get counts() { return { asteroids: asteroids.length, bullets: bullets.length, particles: particles.length, ufo: !!ufo, ship: !!ship }; },
    get ship() { return ship; },
    input,
  };
})();
</script>
</body>
</html>
